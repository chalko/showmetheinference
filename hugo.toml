baseURL = 'https://showmetheinference.com/'
languageCode = 'en-us'
title = 'Show Me the Inference'
theme = 'PaperMod'

[pagination]
  pagerSize = 10

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'monokai'
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = 'production'
  title = 'Show Me the Inference'
  description = 'Local AI and Agentic Staffs by Nick Chalko'
  keywords = ['AI', 'Inference', 'Grace Blackwell', 'vLLM', 'Talos', 'Kubernetes', 'Multi-Agent', 'Gas City', 'Sovereign AI']
  author = 'Nick Chalko'
  DateFormat = 'January 2, 2006'
  defaultTheme = 'auto' # dark, light, auto
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.twitter]
    site = 'chalko'
    creator = 'chalko'

  [params.social]
    twitter = 'chalko'

  socialIcons = [
    { name = 'x', url = 'https://x.com/chalko' },
    { name = 'github', url = 'https://github.com/chalko' },
    { name = 'linkedin', url = 'https://www.linkedin.com/in/chalko/' },
    { name = 'rss', url = '/index.xml' },
  ]

  [params.homeInfoParams]
    Title = "Show Me the Inference"
    Content = "Local AI, GPU compute architecture, and autonomous agentic staffs by Nick Chalko."

  [params.profileMode]
    enabled = false

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Articles'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 20
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 30
